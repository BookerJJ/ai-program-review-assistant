name: Offline artifact audit

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m src.benchmark_evaluator_v1
      - run: python -m src.benchmark_compare
      - run: python -m src.holdout_evaluator_v1
      - run: python -m src.model_comparison_evaluator_v1
